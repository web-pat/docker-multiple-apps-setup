# docker-compose.adapt.yml
# Adapt Learning LMS behind Traefik reverse proxy
# Replaces Moodle with a lightweight, modern LMS

version: '3.8'

services:
  # Adapt Authoring (Course Creation Tool + LMS Frontend)
  adapt:
    image: garyritchie/docker-adaptauthoring:latest
    container_name: adapt_authoring
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      # Admin credentials (used during first setup)
      - ADMIN_EMAIL=${ADAPT_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADAPT_ADMIN_PASSWORD}

      # MongoDB connection
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=adapt-tenant-master
      - MONGO_ADMIN_USER=${ADAPT_MONGO_USER}
      - MONGO_ADMIN_PASSWORD=${ADAPT_MONGO_PASSWORD}

      # Server configuration
      - SERVER_PORT=5000
      - SERVER_NAME=${ADAPT_SITE_URL}
      - DATA_ROOT=data
      - SESSION_SECRET=${ADAPT_SESSION_SECRET}

      # Reverse proxy mode (important for Traefik)
      - ENABLE_REVERSE_PROXY=true
      - REVERSE_PROXY_IP=traefik

      # Email/SMTP (dummy for now, can be configured later)
      - SMTP_SERVICE=dummy
      - SMTP_USERNAME=noreply@${ADAPT_SITE_URL}
      - SMTP_PASSWORD=dummy
      - FROM_ADDRESS=${ADAPT_ADMIN_EMAIL}

    volumes:
      - adapt_data:/adapt_authoring
    networks:
      - adapt_internal
      - traefik_public
    labels:
      # Enable Traefik
      - 'traefik.enable=true'

      # Router configuration
      - 'traefik.http.routers.adapt.rule=Host(`${ADAPT_SITE_URL}`)'
      - 'traefik.http.routers.adapt.entrypoints=websecure'
      - 'traefik.http.routers.adapt.tls.certresolver=letsencrypt'

      # Service configuration
      - 'traefik.http.services.adapt.loadbalancer.server.port=5000'
      - 'traefik.http.services.adapt.loadbalancer.passhostheader=true'

      # Optional: Add security headers middleware
      - 'traefik.http.middlewares.adapt-headers.headers.accesscontrolalloworiginlist=${ADAPT_SITE_URL}'
      - 'traefik.http.middlewares.adapt-headers.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS'
      - 'traefik.http.routers.adapt.middlewares=adapt-headers'

  # MongoDB (Required for Adapt)
  mongodb:
    image: mongo:7.0
    container_name: adapt_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${ADAPT_MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${ADAPT_MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=adapt-tenant-master
    volumes:
      - adapt_mongodb_data:/data/db
    networks:
      - adapt_internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      timeout: 5s
      retries: 10
      interval: 10s

networks:
  adapt_internal:
    name: adapt_internal
    driver: bridge
  traefik_public:
    external: true

volumes:
  adapt_data:
  adapt_mongodb_data:
