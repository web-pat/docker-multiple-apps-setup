services:
  mariadb:
    image: mariadb:10.11
    container_name: moodle_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MOODLE_DB_ROOT_PASSWORD}
      - MYSQL_USER=${MOODLE_DB_USER}
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
      - MYSQL_DATABASE=${MOODLE_DB_NAME}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - moodle_internal

  moodle:
    image: erseco/alpine-moodle:latest
    container_name: moodle_app
    restart: unless-stopped
    environment:
      - SITE_URL=https://${MOODLE_SITE_URL}
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${MOODLE_DB_NAME}
      - DB_USER=${MOODLE_DB_USER}
      - DB_PASS=${MOODLE_DB_PASSWORD}
      - MOODLE_USERNAME=${MOODLE_ADMIN_USERNAME}
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITENAME=${MOODLE_SITENAME}
      - REVERSEPROXY=false
      - SSLPROXY=true
      - client_max_body_size=500M
      - post_max_size=500M
      - upload_max_filesize=500M
      - memory_limit=1G
      - max_input_vars=10000
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/moodledata
    depends_on:
      - mariadb
    networks:
      - moodle_internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moodle.rule=Host(`${MOODLE_SITE_URL}`)"
      - "traefik.http.routers.moodle.entrypoints=websecure"
      - "traefik.http.routers.moodle.tls.certresolver=letsencrypt"
      - "traefik.http.services.moodle.loadbalancer.server.port=8080"

networks:
  moodle_internal:
    name: moodle_internal
    driver: bridge
  traefik_public:
    external: true

volumes:
  mariadb_data:
  moodle_code:
  moodle_data:
